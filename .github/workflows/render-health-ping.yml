name: Render health ping

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Render service active
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::error::Set the RENDER_HEALTH_URL repository variable to your Render /api/health URL."
            exit 1
          fi
          case "$HEALTH_URL" in
            https://*/api/health) ;;
            *)
              echo "::error::RENDER_HEALTH_URL must be an HTTPS URL ending in /api/health."
              exit 1
              ;;
          esac
          curl --fail --silent --show-error --max-time 30 "$HEALTH_URL"
