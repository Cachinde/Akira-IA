services:
  - type: web
    name: akira-wake
    runtime: static
    buildCommand: echo "Publishing the AKIRA wake screen"
    staticPublishPath: ./wake
    autoDeploy: true
    buildFilter:
      paths:
        - wake/**
        - render.yaml
  - type: web
    name: akira-ui
    runtime: docker
    plan: free
    healthCheckPath: /api/health/ready
    envVars:
      - key: HF_SPACE_ID
        value: akra35567/AKIRA-SOFTEDGE
      - key: AKIRA_CHAT_SPACE_ID
        value: akra35567/AKIRA-SOFTEDGE
      - key: NEXT_PUBLIC_SITE_URL
        value: https://akira-ia.onrender.com
      - key: AKIRA_WAKE_ORIGIN
        value: https://akira-wake.onrender.com
      - key: HF_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BILLING_COOKIE_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AKIRA_SSO_SECRET
        sync: false
      - key: SOFTEDGE_SSO_URL
        value: https://softedge-corporation.up.railway.app
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_ULTRA
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_ENCRYPTION
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: AKIRA — SoftEdge Corporation
