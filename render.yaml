services:
  - type: web
    name: akira-ui
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HF_SPACE_ID
        value: akra35567/Akiragpu
      - key: AKIRA_CHAT_SPACE_ID
        value: akra35567/AKIRA-SOFTEDGE
      - key: NEXT_PUBLIC_SITE_URL
        value: https://akira-ia.onrender.com
      - key: HF_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BILLING_COOKIE_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_ULTRA
        sync: false
