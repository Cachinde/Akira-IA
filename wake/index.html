<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111113">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src https://akira-ia.onrender.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
    <title>A preparar a AKIRA</title>
    <link rel="icon" href="/akira-share-v2.png" type="image/png">
    <link rel="stylesheet" href="/wake.css">
    <script src="/wake.js" defer></script>
  </head>
  <body data-app-url="https://akira-ia.onrender.com">
    <main class="wake-card" aria-labelledby="wake-title">
      <img class="brand" src="/akira-share-v2.png" alt="AKIRA — Assistente de inteligência artificial da SoftEdge" width="1200" height="630">
      <div class="status-row" role="status" aria-live="polite" aria-atomic="true">
        <span class="spinner" aria-hidden="true"></span>
        <span id="wake-status">A iniciar uma ligação segura…</span>
      </div>
      <h1 id="wake-title">A preparar o teu espaço</h1>
      <p class="description">A AKIRA está a acordar. As tuas conversas estarão prontas dentro de instantes.</p>
      <div class="progress-track" role="progressbar" aria-label="A preparar a AKIRA">
        <span class="progress-bar"></span>
      </div>
      <button id="retry-button" type="button">Verificar novamente</button>
      <p class="footnote">Podes manter esta página aberta enquanto a ligação é estabelecida.</p>
      <noscript>
        <p class="no-script">Ativa o JavaScript para que esta página te encaminhe automaticamente quando a AKIRA estiver pronta.</p>
      </noscript>
    </main>
    <footer>Um produto da SoftEdge Corporation</footer>
  </body>
</html>
